# Paths below are relative to resource_root; absolute paths remain supported.
resource_root = "../../../MendelPRIME-release-resources"

[resources]
hpo_obo = "core/hpo/hp.obo"
hpo_stats = "core/hpo/hpo_stats.json"
omim_jsonl = "core/omim/omim_clean_full.jsonl"
mim2gene = "core/omim/mim2gene.txt"

[genotype]
java = "tools/java/bin/java"
exomiser_jar = "genotype/exomiser/exomiser-cli-14.0.0.jar"
exomiser_properties = "genotype/exomiser/application-2406.properties"
lirical_jar = "genotype/lirical/lirical-cli-2.4.1.jar"
lirical_version = "2.4.1"
lirical_data = "genotype/lirical/data"
gene_map = "genotype/lirical/data/hgnc_complete_set.txt"

[[genotype.assemblies]]
assembly = "GRCh37"
exomiser_release = "2406"
phenotype_release = "2406"
exomiser_genome_data = "genotype/exomiser/data/2406_hg19"
exomiser_phenotype_data = "genotype/exomiser/data/2406_phenotype"
lirical_exomiser_data = "genotype/exomiser/data/2406_hg19"
lirical_variants_db = "genotype/exomiser/data/2406_hg19/2406_hg19_variants.mv.db"
lirical_clinvar_db = "genotype/exomiser/data/2406_hg19/2406_hg19_clinvar.mv.db"

[variant_knowledge]
clinvar_db = "variant-knowledge/clinvar/clinvar_20260117.sqlite"
clingen_validity = "variant-knowledge/clingen/gene_disease_validity.csv"
clingen_vcep = "variant-knowledge/clingen/variant_pathogenicity.tsv"
clingen_manifest = "variant-knowledge/clingen/resource_manifest.json"

[explanation_resources]
assembly = "GRCh37"
reference_fasta = "assessment/grch37/reference/hg19.fa"
