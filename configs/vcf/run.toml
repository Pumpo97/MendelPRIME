resource_file = "resources.toml"

[llm]
base_url = "https://api.example.invalid/v1"
model = "<MODEL_ID>"
wire_api = "chat_completions"
transport_retries = 1

[execution]
lanes = 1
max_llm_concurrency = 4
queue_timeout_seconds = 1800
cache_choices = false
device = "cpu"

[workers]
sources = 2
briefs = 4
pairwise = 4

[genotype]
max_heap = "12g"
timeout_seconds = 1800

[external]
phen2gene_acknowledged = false
amelie_acknowledged = false
amelie_verify_tls = true

[ranking]
reflection = false

[explanation_resources]
ranking_vep_enabled = false

[output]
explanation = false
