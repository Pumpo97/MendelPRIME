[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "MendelPRIME"
version = "1.0.0"
description = "Evidence-grounded causal-gene prioritization from heterogeneous patient information"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
mendelprime = "mendelprime.runtime.cli:main"

[project.optional-dependencies]
hpo = [
  "numpy==2.4.1",
  "torch==2.9.1",
  "transformers==4.57.5",
]
vcf = [
  "beautifulsoup4==4.14.3",
  "bioutils==0.6.1",
  "hgvs==1.5.7",
  "pyfaidx==0.9.0.4",
  "pysam==0.23.3",
]
full = [
  "beautifulsoup4==4.14.3",
  "bioutils==0.6.1",
  "hgvs==1.5.7",
  "numpy==2.4.1",
  "pyfaidx==0.9.0.4",
  "pysam==0.23.3",
  "torch==2.9.1",
  "transformers==4.57.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mendelprime = [
  "prompts/ranking/*.txt",
  "prompts/ranking/*.json",
  "prompts/explanation/*.txt",
  "prompts/explanation/*.json",
]
